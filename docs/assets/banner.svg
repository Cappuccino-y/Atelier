<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Atelier — 多 Agent 协作聊天室">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#131a38"/>
      <stop offset="1" stop-color="#1d1442"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glowIndigo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" opacity="0.055"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <circle cx="1060" cy="30" r="230" fill="url(#glowIndigo)"/>
  <circle cx="110" cy="310" r="210" fill="url(#glowPink)"/>

  <!-- decorative handoff chain: nodes + dashed arrows (top-right) -->
  <g stroke="#818cf8" stroke-opacity="0.35" fill="none">
    <path d="M 950 62 H 1010" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <path d="M 1040 62 H 1100" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#818cf8" fill-opacity="0.45"/>
    </marker>
  </defs>
  <circle cx="936" cy="62" r="7" fill="#f97316" fill-opacity="0.85"/>
  <circle cx="1025" cy="62" r="7" fill="#ec4899" fill-opacity="0.85"/>
  <circle cx="1114" cy="62" r="7" fill="#22c55e" fill-opacity="0.85"/>
  <text x="1025" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#a5b4fc" fill-opacity="0.75">[RESULT] → [REVIEW]</text>

  <!-- logo mark -->
  <rect x="572" y="38" width="56" height="56" rx="15" fill="url(#mark)"/>
  <text x="600" y="79" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff">A</text>

  <!-- wordmark -->
  <text x="600" y="163" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="66" font-weight="800" letter-spacing="1" fill="url(#wordmark)">Atelier</text>

  <!-- tagline -->
  <text x="600" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#cbd5e1">多 Agent 协作聊天室 — AI 专家同处一室 · 派活 · 评审 · 交付</text>

  <!-- agent chips -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="16">
    <!-- Atlas -->
    <rect x="271" y="224" width="118" height="40" rx="20" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-opacity="0.55"/>
    <text x="330" y="249" text-anchor="middle" fill="#93c5fd">🧭 Atlas</text>
    <!-- Forge -->
    <rect x="403" y="224" width="118" height="40" rx="20" fill="#f97316" fill-opacity="0.16" stroke="#f97316" stroke-opacity="0.55"/>
    <text x="462" y="249" text-anchor="middle" fill="#fdba74">🔨 Forge</text>
    <!-- Lens -->
    <rect x="535" y="224" width="108" height="40" rx="20" fill="#ec4899" fill-opacity="0.16" stroke="#ec4899" stroke-opacity="0.55"/>
    <text x="589" y="249" text-anchor="middle" fill="#f9a8d4">🔍 Lens</text>
    <!-- Echo -->
    <rect x="657" y="224" width="108" height="40" rx="20" fill="#22c55e" fill-opacity="0.16" stroke="#22c55e" stroke-opacity="0.55"/>
    <text x="711" y="249" text-anchor="middle" fill="#86efac">💬 Echo</text>
    <!-- more -->
    <rect x="779" y="224" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#94a3b8" stroke-opacity="0.4"/>
    <text x="854" y="249" text-anchor="middle" fill="#cbd5e1">+ 5 specialists</text>
  </g>
</svg>
